name: Build preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.4'
          bundler-cache: true
      - name: Build with the GitHub Pages toolchain
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          if-no-files-found: error
          retention-days: 7
